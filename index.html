<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>林的训</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
.bodybox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}.bodygrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.bodybox input{width:100%;min-width:0;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface2)}
/* Layout: one phone-width column, sticky header, fixed 4-tab bar, rest-timer dock floating above the bar.
   Weight-plate discs mark sets. Plate colours carry meaning: blue = action, green = done, yellow = rest, red = delete. */
:root{
  --bg:#ECEEF3; --surface:#FFFFFF; --surface2:#F3F5F9; --ink:#12161E; --ink2:#586072;
  --line:#DADFE8; --line2:#BFC7D6;
  --accent:#2354D6; --accent-ink:#FFFFFF; --accent-soft:#E2E9FC; --bar:#B9C8F3;
  --good:#1E8E55; --good-ink:#FFFFFF; --good-soft:#DCF2E6;
  --warn:#B97A00; --warn-soft:#FFF0C9;
  --bad:#C93428; --bad-soft:#FCE4E1;
  --scrim:rgba(10,14,22,.5);
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Noto Sans SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1116; --surface:#171B23; --surface2:#202632; --ink:#E9EDF4; --ink2:#9AA3B5;
    --line:#2A3140; --line2:#3A4357;
    --accent:#7499FF; --accent-ink:#0B1330; --accent-soft:#1B2A52; --bar:#31456F;
    --good:#4CC98A; --good-ink:#08241A; --good-soft:#143127;
    --warn:#F2B73C; --warn-soft:#3A2D0F;
    --bad:#FF7B6E; --bad-soft:#3E1D1A;
    --scrim:rgba(0,0,0,.62);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1116; --surface:#171B23; --surface2:#202632; --ink:#E9EDF4; --ink2:#9AA3B5;
  --line:#2A3140; --line2:#3A4357;
  --accent:#7499FF; --accent-ink:#0B1330; --accent-soft:#1B2A52; --bar:#31456F;
  --good:#4CC98A; --good-ink:#08241A; --good-soft:#143127;
  --warn:#F2B73C; --warn-soft:#3A2D0F;
  --bad:#FF7B6E; --bad-soft:#3E1D1A;
  --scrim:rgba(0,0,0,.62);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  font-variant-numeric:tabular-nums;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--bg);display:flex;align-items:center;justify-content:space-between;height:54px}
.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800;letter-spacing:.02em}
.brand svg{width:26px;height:26px}
.live{font-size:12px;font-weight:700;color:var(--good);background:var(--good-soft);border-radius:99px;padding:3px 10px}
.icon{width:44px;height:44px;border:0;background:transparent;border-radius:12px;display:grid;place-items:center}
.icon svg,.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
main{padding-bottom:210px}
h1{margin:4px 0 16px;font-size:32px;line-height:1.15;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
h2.sec{margin:26px 0 10px;font-size:14px;font-weight:700;color:var(--ink2);display:flex;justify-content:space-between;gap:12px;letter-spacing:.04em}
h2.sec span{font-weight:500;letter-spacing:0}
.k{font-size:12px;color:var(--ink2);letter-spacing:.06em}
.empty{padding:28px 8px;text-align:center;color:var(--ink2);text-wrap:balance}

.btn{min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn small{font-weight:500;font-size:12px;opacity:.8}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{min-height:58px;font-size:18px;font-weight:700;width:100%}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.4;cursor:default}
.btn.add{width:100%;border-style:dashed;border-color:var(--line2);background:transparent;color:var(--ink2);margin:2px 0 14px}
.btn.fin{margin-top:6px}

.hero{display:grid;gap:12px;padding-top:12px}
.hero .btn small{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero .btn:not(.primary){flex-direction:column;gap:2px;padding:10px 16px;min-height:56px}
.wk{margin-top:18px;display:flex;gap:10px}
.wk div{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.wk .v{display:block;font-size:22px;line-height:1.3;font-weight:800}
.wk .v small{font-size:12px;font-weight:600;color:var(--ink2);margin:0 3px 0 1px}
.say{margin:0;color:var(--ink2);font-size:14px;line-height:1.5}
.hero .say{margin:-6px 0 0;font-size:15px}
.cheer{background:var(--accent-soft);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600;line-height:1.5}
.srch{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-size:16px;margin:10px 0 0}
.pstick{position:sticky;top:0;z-index:2;margin:-18px 0 0;padding:18px 0 10px;background:var(--surface)}
.pstick .srch{background:var(--surface2);margin-top:10px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.rowm{flex:1;min-width:0;display:grid}
.rowm span{font-size:12.5px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.sum{display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:end;margin:6px 0 16px}
.sum .big{font-size:40px;line-height:1;font-weight:800;letter-spacing:-.02em}
.sum .mid{font-size:15px;color:var(--ink2);text-align:right}
.sum .mid b{font-size:26px;color:var(--ink)}
.bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}

.ex{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;display:grid;gap:14px}
.ex.fin{border-color:var(--good)}
.ex-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ex-n{font-size:19px;font-weight:700;line-height:1.25}
.tag{display:inline-block;margin-left:8px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--ink2);vertical-align:2px}
.tag.ok{background:var(--good-soft);color:var(--good)}
.last{font-size:12.5px;color:var(--ink2);margin-top:2px}
.remain{display:flex;align-items:center;justify-content:space-between;gap:10px}
.remain .n{font-size:44px;line-height:1;font-weight:800;letter-spacing:-.02em}
.remain .n small{font-size:14px;font-weight:600;color:var(--ink2);margin-left:6px;letter-spacing:0}
.tgt{display:flex;gap:6px;align-items:center;color:var(--ink2);font-size:12px}
.tgt button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface2);font-size:20px;line-height:1}
.plates{display:flex;gap:6px;flex-wrap:wrap}
.disc{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ink2);border:2px solid var(--line2);box-shadow:inset 0 0 0 3px var(--surface)}
.disc.next{border-color:var(--accent);color:var(--accent)}
.disc.done{background:var(--good);border-color:var(--good);color:var(--good-ink)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fld{min-width:0}
.fld label{display:block;font-size:12px;color:var(--ink2);margin-bottom:4px}
.stp{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface2)}
.stp button{width:46px;border:0;background:transparent;font-size:22px;color:var(--ink)}
.stp button:active{background:var(--line)}
.stp input{flex:1;min-width:0;width:100%;border:0;background:transparent;text-align:center;font-size:22px;font-weight:800;padding:10px 0}
.acts{display:grid;grid-template-columns:1fr auto;gap:8px}
.acts .btn:first-child{min-height:56px;font-size:17px;font-weight:700;flex-direction:column;gap:2px}
.slog{display:flex;flex-wrap:wrap;gap:6px}
.sc{font-size:13px;background:var(--surface2);border-radius:8px;padding:4px 8px;display:inline-flex;gap:6px;align-items:center}
.sc em{font-style:normal;font-size:10.5px;font-weight:800;background:var(--warn-soft);color:var(--warn);border-radius:5px;padding:1px 5px}
.rest{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rest>span{font-size:12px;color:var(--ink2);margin-right:2px}
.chip{min-width:42px;height:34px;border-radius:99px;border:1px solid var(--line);background:var(--surface);padding:0 10px;font-size:13px;font-weight:600}
.chip.on{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.restin{width:64px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);text-align:center;font-size:16px}
.rmv{border:0;background:transparent;color:var(--ink2);font-size:13px;min-height:38px;padding:0 8px;border-radius:8px}

.dockw{position:fixed;left:0;right:0;bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:19;display:flex;justify-content:center;padding:0 max(12px,env(safe-area-inset-left,0px)) 0 max(12px,env(safe-area-inset-right,0px));pointer-events:none}
.dk{pointer-events:auto;width:100%;max-width:560px;background:var(--surface);border:1px solid var(--warn);border-radius:16px;box-shadow:0 8px 28px rgba(0,0,0,.22);overflow:hidden}
.dk-bar{height:5px;background:var(--warn-soft)}
.dk-bar i{display:block;height:100%;width:100%;background:var(--warn)}
.dk-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px}
.dk-main{min-width:0}
.dk-l{font-size:12.5px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dk-t{font-size:34px;line-height:1.1;font-weight:800;letter-spacing:-.01em}
.dk-btns{display:flex;gap:6px;flex:none}
.dk.up{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dk.up .dk-l{color:var(--accent-ink);opacity:.85}
.dk.up .dk-bar{background:transparent}
.dk.up .btn{background:transparent;color:var(--accent-ink);border-color:var(--accent-ink)}
.dk.up .btn.skip{background:var(--accent-ink);color:var(--accent)}
.dk.up{animation:pulse 1s ease-in-out 3}
@keyframes pulse{50%{transform:scale(1.02)}}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs .in{width:100%;max-width:560px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tabs button{border:0;background:transparent;display:grid;justify-items:center;gap:2px;padding:6px 0 4px;border-radius:12px;color:var(--ink2);font-size:11.5px;font-weight:600}
.tabs button.on{color:var(--accent)}

#sheet{position:fixed;inset:0;z-index:50}
.scrim{position:absolute;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.panel{width:100%;max-width:560px;max-height:90%;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:grid;gap:14px;align-content:start}
.panel h3{margin:0;font-size:20px;font-weight:800}
.panel p{margin:0;color:var(--ink2);font-size:13.5px}
.panel label.l{display:block;font-size:12.5px;color:var(--ink2);margin-bottom:4px}
.panel input[type=text],.panel input[type=number],.panel select{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);padding:0 12px;font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0}
.seg span{display:grid;place-items:center;height:44px;border-radius:12px;border:1px solid var(--line);font-size:13.5px;font-weight:600;background:var(--surface2)}
.seg input:checked+span{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.pick{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;min-height:50px;padding:6px 12px;margin-bottom:6px}
.pick .tg{font-size:12px;color:var(--ink2)}
.pick.added{background:var(--good-soft);border-color:var(--good)}
.pick.added .tg{color:var(--good);font-weight:700}
.grp{font-size:12px;font-weight:700;color:var(--ink2);margin:10px 0 6px;letter-spacing:.06em}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:46px}
.tog input{width:22px;height:22px;accent-color:var(--accent)}
.note{font-size:12.5px;color:var(--ink2);background:var(--surface2);border-radius:10px;padding:10px 12px}
.ghost{background:transparent}

.sess{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden}
.sess-h{width:100%;border:0;background:transparent;text-align:left;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:2px 12px}
.sess-h b{font-size:16px}
.sess-h .dur{font-size:17px;font-weight:800;text-align:right}
.sess-h .sub{grid-column:1/-1;font-size:12.5px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess-d{padding:2px 14px 14px;display:grid;gap:12px;border-top:1px solid var(--line)}
.di{display:grid;gap:6px;padding-top:10px}
.di b{font-size:14px}
.sess-a{display:flex;gap:8px;justify-content:flex-end}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.tile .v{font-size:28px;line-height:1.15;font-weight:800;letter-spacing:-.01em;margin-top:2px}
.tile .v small{font-size:13px;font-weight:600;color:var(--ink2);margin:0 4px 0 2px;letter-spacing:0}
.tile .d{font-size:12px;color:var(--ink2);margin-top:2px}
.mnav{display:flex;align-items:center;justify-content:space-between;margin:2px 0 12px}
.mnav b{font-size:18px}
.mnav .btn{min-width:46px;padding:0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .w{font-size:11px;color:var(--ink2);text-align:center;padding-bottom:2px}
.cal .c{aspect-ratio:1/1;max-width:100%;border-radius:8px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--ink2)}
.cal .c.e{background:transparent;border-color:transparent}
.cal .c.l1{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--ink)}
.cal .c.l2{background:var(--bar);border-color:var(--bar);color:var(--ink);font-weight:700}
.cal .c.l3{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:800}
.cal .c.today{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;gap:10px;align-items:center;justify-content:flex-end;font-size:11.5px;color:var(--ink2);margin-top:8px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-3px;margin-right:3px}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 8px 6px}
.chart svg{display:block;width:100%;height:auto}
.chart .cap{font-size:12px;color:var(--ink2);padding:0 8px 6px}
svg .grid{stroke:var(--line);stroke-width:1;fill:none}
svg .ax{fill:var(--ink2);font-size:10px;font-family:var(--sans)}
svg .axv{fill:var(--ink);font-size:10px;font-weight:700;font-family:var(--sans)}
svg .ln{stroke:var(--accent);stroke-width:2.5;fill:none;stroke-linejoin:round;stroke-linecap:round}
svg .pt{fill:var(--accent)}
svg .pt.last{stroke:var(--surface);stroke-width:2}
svg .bar1{fill:var(--bar)}
svg .bar1.sel{fill:var(--accent)}
svg [data-act]{cursor:pointer}
.sel-ex{margin-bottom:10px}
.sel-ex select{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-size:16px}
.prog{display:flex;gap:10px;margin-top:10px}
.prog .tile{flex:1}
.prog .tile .v{font-size:20px}
.hist{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.hist div{display:flex;justify-content:space-between;gap:10px;padding:9px 14px;font-size:13.5px}
.hist div+div{border-top:1px solid var(--line)}
.hist span:first-child{color:var(--ink2)}


.plan-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0 18px}
.plan-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:9px;min-height:158px;color:var(--ink)}
.plan-card .plan-mark{width:34px;height:34px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:17px}
.plan-card b{font-size:18px}.plan-card small{color:var(--ink2);line-height:1.5}.plan-card .plan-foot{margin-top:auto;color:var(--accent);font-weight:700;font-size:13px}
.plan-tools{display:flex;gap:8px;align-items:center;margin:8px 0 18px}.plan-tools .btn{flex:1}
.plan-row{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.plan-row input{width:20px;height:20px;accent-color:var(--accent)}.plan-row .rowm{flex:1;min-width:0}
@media(max-width:380px){.plan-grid{gap:8px}.plan-card{padding:13px}}

#toast{position:fixed;left:50%;bottom:calc(176px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;max-width:88%;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;text-align:center}
#toast.on{opacity:1}
@media (prefers-reduced-motion: reduce){.dk.up{animation:none}.bar i{transition:none}}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="12" fill="var(--accent)"/><circle cx="14" cy="14" r="9" fill="none" stroke="var(--accent-ink)" stroke-width="1.5" opacity=".55"/><circle cx="14" cy="14" r="3.2" fill="var(--bg)"/></svg>
      林的训<span class="live" id="live" hidden>训练中</span>
    </div>
    <button class="icon" data-act="settings" aria-label="设置"><svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
  </header>

<script>
(function(){

var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};

var ymd=function(ts){var d=new Date(ts);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
var fmtDate=function(ts){var d=new Date(ts);return (d.getMonth()+1)+'月'+d.getDate()+'日 周'+WD[d.getDay()]};
var mdate=function(ts){var d=new Date(ts);return (d.getMonth()+1)+'/'+d.getDate()};
var fmtTime=function(ts){var d=new Date(ts);return p2(d.getHours())+':'+p2(d.getMinutes())};
var ymLabel=function(k){var a=k.split('-');return a[0]+'年'+(+a[1])+'月'};
var shiftMonth=function(k,d){var a=k.split('-').map(Number);return mk(new Date(a[0],a[1]-1+d,1).getTime())};
function fmtDur(sec){var m=Math.round(sec/60);if(m<1)return '不到1分钟';if(m<60)return m+'分钟';var h=Math.floor(m/60),r=m%60;return r?h+'小时'+r+'分':h+'小时'}
function durHtml(sec){var m=Math.round(sec/60);if(m<60)return '<b>'+m+'</b><small>分钟</small>';var h=Math.floor(m/60),r=m%60;return '<b>'+h+'</b><small>时</small><b>'+r+'</b><small>分</small>'}
function fmtClock(sec){sec=Math.max(0,Math.floor(sec));var h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h?h+':'+p2(m)+':'+p2(s):p2(m)+':'+p2(s)}
function fmtSet(type,s){var w=fmtNum(s.w);if(type==='weight')return w+'kg × '+s.r;if(type==='assist')return '辅助 '+w+'kg × '+s.r;if(type==='bw')return s.r+' 次';if(type==='time')return s.r+' 秒';return ''}

/* ---------- 数据 ---------- */
function presets(){return [
  {id:'p-pullup',name:'引体向上',group:'背',type:'assist',sets:4,reps:8,w:80,rest:120,step:5},
  {id:'p-bench',name:'杠铃卧推',group:'胸',type:'weight',sets:4,reps:8,w:40,rest:120,step:2.5},
  {id:'p-squat',name:'深蹲',group:'腿',type:'weight',sets:4,reps:8,w:40,rest:150,step:2.5},
  {id:'p-dead',name:'硬拉',group:'背',type:'weight',sets:3,reps:5,w:60,rest:180,step:2.5},

]}
function X(id,name,group,type,sets,reps,w,rest,step){return {id:'p-'+id,name:name,group:group,type:type,sets:sets,reps:reps,w:w,rest:rest,step:step}}
function presetsV2(){return [

  X('dbincline','哑铃上斜卧推','胸','weight',3,10,14,90,2.5),
  X('dbfly','哑铃飞鸟','胸','weight',3,12,8,60,1),
  X('cablefly','龙门架夹胸','胸','weight',3,12,15,60,5),
  X('chestpress','器械推胸','胸','weight',3,10,30,90,5),
  X('latpd','高位下拉','背','weight',4,10,40,90,5),
  X('seatedrow','坐姿划船','背','weight',3,10,40,90,5),

  X('tbar','T杠划船','背','weight',3,10,30,90,2.5),
  X('straightarm','直臂下压','背','weight',3,12,20,60,2.5),
  X('pullupbw','自重引体向上','背','bw',4,6,0,120,1),
  X('chinup','反手引体向上','背','assist',4,8,60,120,5),
  X('hyper','山羊挺身','背','bw',3,15,0,60,1),
  X('frontsquat','前蹲','腿','weight',3,8,30,150,2.5),
  X('legpress','腿举','腿','weight',4,12,80,120,10),
  X('rdl','罗马尼亚硬拉','腿','weight',3,10,40,120,2.5),

  X('legext','腿屈伸','腿','weight',3,12,30,60,5),
  X('legcurl','腿弯举','腿','weight',3,12,25,60,5),
  X('hipthrust','杠铃臀推','腿','weight',4,10,60,90,5),
  X('calf','站姿提踵','腿','weight',4,15,40,60,5),
  X('goblet','高脚杯深蹲','腿','weight',3,12,16,90,2.5),
  X('barohp','杠铃推举','肩','weight',4,8,30,120,2.5),
  X('lateral','哑铃侧平举','肩','weight',3,12,6,60,1),

  X('barcurl','杠铃弯举','手臂','weight',3,10,20,75,2.5),
  X('dbcurl','哑铃弯举','手臂','weight',3,12,8,60,1),
  X('hammer','锤式弯举','手臂','weight',3,12,8,60,1),
  X('pushdown','绳索下压','手臂','weight',3,12,25,60,5),
  X('skull','仰卧臂屈伸','手臂','weight',3,10,15,75,2.5),
  X('closebench','窄距卧推','手臂','weight',3,8,30,90,2.5),
  X('crunch','卷腹','核心','bw',3,20,0,45,1),
  X('legraise','悬垂举腿','核心','bw',3,10,0,60,1),
  X('russian','俄罗斯转体','核心','bw',3,20,0,45,1),
  X('sideplank','侧平板支撑','核心','time',3,30,0,30,1),
  X('treadmill','跑步机','有氧','time',1,1200,0,0,1),
  X('rope','跳绳','有氧','time',3,120,0,60,1),
  X('rower','划船机','有氧','time',1,900,0,0,1),
  X('bike','动感单车','有氧','time',1,1200,0,0,1)
]}
function allPresets(){return presets().concat(presetsV2())}
var PV=2,migrated=false;
function normalize(meta,sess){
  meta=meta||{};
  var s={v:1,
    exercises:Array.isArray(meta.exercises)?meta.exercises:allPresets(),
    templates:Array.isArray(meta.templates)?meta.templates:[],
    settings:Object.assign({sound:true,vibrate:true},meta.settings||{}),
    active:meta.active||null,
    pv:Array.isArray(meta.exercises)?(meta.pv||1):PV,
    sessions:(sess||[]).slice().sort(function(a,b){return b.start-a.start})};
  if(s.pv<PV){
    var have={};s.exercises.forEach(function(e){have[e.id]=1});
    presetsV2().forEach(function(p){if(!have[p.id])s.exercises.push(p)});
    s.pv=PV;migrated=true;
  }
  return s;
}
var LS='lin-de-xun-pro-v2';
var state=normalize(null,[]);
var hadLocal=false;
try{var raw=localStorage.getItem(LS);if(raw){var o=JSON.parse(raw);state=normalize(o.meta,o.sessions);hadLocal=true}}catch(e){}

// 兼容旧版「林的训」数据：保留旧 key，并把训练历史迁移到新版结构。
if(!hadLocal){
  try{
    var old=JSON.parse(localStorage.getItem('lin-de-xun-v1')||'null');
    if(old&&Array.isArray(old.logs)){
      var exMap={};
      (old.logs||[]).forEach(function(log,li){
        var items=[];(log.exercises||[]).forEach(function(ex){
          var id='legacy-'+ex.name.replace(/[^\u4e00-\u9fa5a-zA-Z0-9]/g,'');
          var assist=ex.name==='引体向上';
          if(!exMap[id]){exMap[id]=1;state.exercises.push({id:id,name:ex.name,group:(/胸|卧推|夹胸/.test(ex.name)?'胸':/腿|深蹲|硬拉/.test(ex.name)?'腿':/肩/.test(ex.name)?'肩':/腹|支撑/.test(ex.name)?'核心':'背'),type:assist?'assist':'weight',sets:Math.max(1,ex.sets&&ex.sets.length||3),reps:10,w:0,rest:90,step:2.5})}
          var sets=(ex.sets||[]).filter(function(x){return x&&x.done!==false}).map(function(x,k){var q={r:Number(x.reps)||0,t:Date.now()+li*1000+k};if(assist)q.w=Number(x.assist)||0;else q.w=Number(x.weight)||0;return q}).filter(function(x){return x.r>0});
          if(sets.length)items.push({exId:id,name:ex.name,group:'其他',type:assist?'assist':'weight',sets:sets});
        });
        if(items.length){var ts=Date.parse((log.date||new Date().toISOString().slice(0,10))+'T12:00:00');state.sessions.push({id:'legacy-'+li+'-'+ts,start:ts,end:ts+(Number(log.duration)||0)*1000,dur:Number(log.duration)||0,note:'从旧版林的训迁移',items:items})}
      });
      state.sessions.sort(function(a,b){return b.start-a.start});
      state.body=Array.isArray(old.body)?old.body:[];
      hadLocal=true;localStorage.setItem(LS,JSON.stringify({meta:{v:1,pv:state.pv,exercises:state.exercises,templates:state.templates,settings:state.settings,active:state.active,body:state.body},sessions:state.sessions}));
    }
  }catch(e){}
}
state.body=Array.isArray(state.body)?state.body:[];
var metaOf=function(){return {v:1,pv:state.pv,exercises:state.exercises,templates:state.templates,settings:state.settings,active:state.active,body:state.body}};
var ui={tab:'train',month:mk(Date.now()),exSel:null,open:{},sync:'local'};
var store={col:null,dirty:false};
var caps={dl:null};

function persistLocal(){try{localStorage.setItem(LS,JSON.stringify({meta:metaOf(),sessions:state.sessions}))}catch(e){}}
var tLocal=null,tMeta=null,metaBusy=false,metaAgain=false;
function touch(){
  store.dirty=true;
  clearTimeout(tLocal);tLocal=setTimeout(persistLocal,250);
  clearTimeout(tMeta);tMeta=setTimeout(flushMeta,700);
}
function flushMeta(){
  if(!store.col)return;
  if(metaBusy){metaAgain=true;return}
  metaBusy=true;
  store.col.doc('meta').set(clone(metaOf())).then(function(){ui.sync='cloud'}).catch(function(){ui.sync='err'}).then(function(){
    metaBusy=false;if(metaAgain){metaAgain=false;flushMeta()}
  });
}
function putSession(s){
  persistLocal();
  if(store.col)store.col.doc('s_'+s.id).set(clone(s)).catch(function(){ui.sync='err'});
}
function delSession(id){
  persistLocal();
  if(store.col)store.col.doc('s_'+id).delete().catch(function(){ui.sync='err'});
}
window.addEventListener('pagehide',function(){persistLocal()});

function withTimeout(p,ms){return Promise.race([p,new Promise(function(_,rej){setTimeout(function(){rej(new Error('timeout'))},ms)})])}
function initStore(){
  var C=window.claude;
  if(!C||!C.use){return}
  Promise.all([C.use('db'),C.use('user'),C.use('downloads')]).then(function(r){
    caps.dl=r[2]||null;
    var db=r[0],user=r[1];
    if(!db||!user)return;
    return user.id().then(function(id){
      if(!id)return;
      var col=db.collection('data/users/'+id);
      return withTimeout(col.limit(1000).get(),9000).then(function(snap){
        var meta=null,rs=[];
        snap.docs.forEach(function(d){var v=d.data();if(!v)return;if(d.id==='meta')meta=clone(v);else if(d.id.indexOf('s_')===0)rs.push(clone(v))});
        var remoteHas=!!meta||rs.length>0;
        var ids={};rs.forEach(function(s){ids[s.id]=1});
        if(remoteHas&&!store.dirty){state=normalize(meta,rs);if(migrated){store.dirty=true;migrated=false}}
        else if(remoteHas&&store.dirty){
          state.sessions.forEach(function(s){ids[s.id]=ids[s.id]||0});
          var have={};state.sessions.forEach(function(s){have[s.id]=1});
          rs.forEach(function(s){if(!have[s.id])state.sessions.push(s)});
          state.sessions.sort(function(a,b){return b.start-a.start});
        }
        store.col=col;ui.sync='cloud';
        var up=[];
        if(!meta||store.dirty)up.push(col.doc('meta').set(clone(metaOf())));
        var remoteIds={};rs.forEach(function(s){remoteIds[s.id]=1});
        state.sessions.forEach(function(s){if(!remoteIds[s.id])up.push(col.doc('s_'+s.id).set(clone(s)))});
        persistLocal();
        render();
        return Promise.all(up).catch(function(){ui.sync='err'});
      });
    });
  }).catch(function(){ui.sync=store.col?'err':'local'});
}

// 首次使用时提供 A/B 两套默认训练计划；已有自定义计划不会被覆盖。
function ensureDefaultPlans(){
  var defs=[
    {id:'plan-a-default',name:'训练 A',kind:'default',desc:'胸部 · 肩部 · 三头 · 下肢功能',items:[['p-bench',3],['p-dbincline',3],['p-dip',2],['p-cablefly',2],['p-lateral',4],['p-pushdown',2],['p-bulgarian',3],['p-sideplank',2]]},
    {id:'plan-b-default',name:'训练 B',kind:'default',desc:'背部 · 后束 · 二头 · 腿后侧 · 核心',items:[['p-pullup',3],['p-latpd',2],['p-seatedrow',3],['p-reardelt',4],['p-hammer',2],['p-rdl',3],['p-crunch',2]]}
  ];
  defs.forEach(function(d){if(!state.templates.some(function(t){return t.id===d.id})){state.templates.unshift({id:d.id,name:d.name,kind:'default',desc:d.desc,items:d.items.filter(function(x){return state.exercises.some(function(e){return e.id===x[0]})}).map(function(x){return {exId:x[0],sets:x[1]}})})}});
}
ensureDefaultPlans();

/* ---------- 成绩与比较 ---------- */
function scoreOf(type,s){if(type==='weight')return s.w*1000+s.r;if(type==='assist')return -s.w*1000+s.r;return s.r}
function bestOf(type,sets){var b=null,bs=-Infinity;sets.forEach(function(s){var sc=scoreOf(type,s);if(sc>bs){bs=sc;b=s}});return b}
function lastPerf(exId){
  for(var i=0;i<state.sessions.length;i++){
    var s=state.sessions[i];
    for(var j=0;j<s.items.length;j++){var it=s.items[j];if(it.exId===exId&&it.sets.length)return {start:s.start,sets:it.sets}}
  }
  return null;
}
function histBest(exId,type){
  var all=[];
  state.sessions.forEach(function(s){s.items.forEach(function(it){if(it.exId===exId)it.sets.forEach(function(x){all.push(x)})})});
  return all.length?bestOf(type,all):null;
}
function sessStats(s){var sets=0,vol=0;s.items.forEach(function(it){sets+=it.sets.length;if(it.type==='weight')it.sets.forEach(function(x){vol+=x.w*x.r})});return {sets:sets,vol:vol}}

/* ---------- 训练流程 ---------- */
function makeItem(ex,count){
  var lp=lastPerf(ex.id),w=ex.w||0,r=ex.reps||10;
  if(lp){var ls=lp.sets[lp.sets.length-1];if(ls){if(hasWeight(ex.type))w=ls.w;r=ls.r}}
  return {id:uid(),exId:ex.id,name:ex.name,group:ex.group,type:ex.type,step:ex.step||2.5,target:count||ex.sets||3,sets:[],w:w,r:r,rest:ex.rest==null?90:ex.rest};
}
function exFromSnap(it){
  var ex=state.exercises.filter(function(e){return e.id===it.exId})[0];
  return ex||{id:it.exId,name:it.name,group:it.group,type:it.type,sets:it.sets?it.sets.length:3,reps:10,w:0,rest:90,step:2.5};
}
function startWorkout(items){state.active={start:Date.now(),items:items,rest:null};ui.tab='train';touch();render();window.scrollTo(0,0)}
function completeSet(i){
  var a=state.active,it=a.items[i];
  var s={r:num(it.r),t:Date.now()};
  if(hasWeight(it.type))s.w=num(it.w);
  if(!(s.r>0)){toast(it.type==='time'?'秒数要大于 0':'次数要大于 0');return}
  var hb=histBest(it.exId,it.type);
  var prevAll=it.sets.slice();if(hb)prevAll.push(hb);
  var isPR=false;
  if(hb){var best=bestOf(it.type,prevAll);isPR=scoreOf(it.type,s)>scoreOf(it.type,best)}
  if(isPR)s.pr=true;
  it.sets.push(s);
  if(it.target<it.sets.length)it.target=it.sets.length;
  if(it.rest>0)a.rest={end:Date.now()+it.rest*1000,total:it.rest,name:it.name};
  alertedEnd=0;resetTitle();
  touch();render();
  var rem2=Math.max(0,it.target-it.sets.length);
  if(isPR)toast('新纪录！'+fmtSet(it.type,s)+'，又突破了自己');
  else if(a.items.every(function(x){return x.sets.length>=x.target}))toast('动作都练完了，漂亮！可以结束训练');
  else toast(setSay(rem2,it.sets.length));
}

/* ---------- 提示 ---------- */
var actx=null,alertedEnd=0;
function unlockAudio(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){}}
function beep(){
  if(!actx)return;
  try{
    var t=actx.currentTime;
    [0,0.3,0.6].forEach(function(d,i){
      var o=actx.createOscillator(),g=actx.createGain();
      o.type='sine';o.frequency.value=i===2?1175:880;
      g.gain.setValueAtTime(0.0001,t+d);g.gain.exponentialRampToValueAtTime(0.4,t+d+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d+0.22);
      o.connect(g);g.connect(actx.destination);o.start(t+d);o.stop(t+d+0.25);
    });
  }catch(e){}
}
function fireAlert(){
  if(state.settings.sound)beep();
  if(state.settings.vibrate){try{if(navigator.vibrate)navigator.vibrate([250,120,250,120,500])}catch(e){}}
  if(document.hidden)document.title='休息结束 · 林的训';
}
function resetTitle(){if(document.title!=='林的训')document.title='林的训'}
var toastT=null;
function toast(msg){var t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on')},2400)}
var wl=null;
function syncWake(){
  try{
    if(state.active&&document.visibilityState==='visible'&&navigator.wakeLock){
      if(!wl){navigator.wakeLock.request('screen').then(function(l){wl=l;l.addEventListener('release',function(){wl=null})}).catch(function(){})}
    }else if(wl){wl.release();wl=null}
  }catch(e){wl=null}
}

/* ---------- 训练页 ---------- */
function rnd(a){return a[Math.floor(Math.random()*a.length)]}
function dayPick(a){return a[new Date().getDate()%a.length]}
function idleSay(){
  var now=Date.now(),last=state.sessions[0],md=monthData(mk(now));
  if(!last)return dayPick(['第一次从简单的动作开始就好，重要的是开始。','先练一组试试，动起来就赢了一半。']);
  if(ymd(last.start)===ymd(now))return dayPick(['今天已经练过了，吃好睡好，肌肉是在休息时长出来的。','今天的训练已完成，想再加一组也行，量力而行。']);
  var gap=Math.floor((now-last.start)/86400000);
  if(gap>=7)return dayPick(['隔了几天没关系，今天轻松练一点就算回来了。','回来就好，从熟悉的动作开始。']);
  if(md.n>=8)return '本月已经练了 '+md.n+' 次，节奏很稳，继续保持。';
  if(md.n>=1)return dayPick(['本月已经练了 '+md.n+' 次，今天再来一次。','坚持比强度更重要，今天也来练一练。','每一次出现在训练里，都是在给自己加分。']);
  return dayPick(['新的一个月，从今天这一练开始。','今天练完，这个月就有第一条记录了。']);
}
function progressSay(pct,dn){
  if(dn===0)return '先把第一组做标准，后面的就顺了。';
  if(pct>=100)return '全部练完了，辛苦了，可以结束训练。';
  if(pct>=75)return '快收尾了，最后几组守住动作质量。';
  if(pct>=50)return '过半了，状态不错，继续。';
  return '已经开始了，一组一组来。';
}
function setSay(rem,done){
  if(rem===0)return rnd(['这个动作完成了，漂亮！','拿下，这个动作搞定。']);
  if(rem===1)return rnd(['最后一组，稳稳做完！','只剩一组了，收个漂亮的尾。']);
  return rnd(['第 '+done+' 组完成，还剩 '+rem+' 组。','很稳，休息好再来。','节奏不错，继续。']);
}
function monthSay(key,md,prev,cur){
  if(!md.n)return key===cur?'这个月还没开始，今天练一次就算开张。':'';

  if(prev.dur&&md.dur>prev.dur)s+=' 比上个月多练了 '+fmtDur(md.dur-prev.dur)+'，进步看得见。';

function niceStep(raw){var p=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
function barChart(keys,vals,sel){
  var W=360,H=160,L=8,R=8,T=20,B=24,n=keys.length,slot=(W-L-R)/n,bw=Math.min(24,slot-8),max=Math.max.apply(null,vals.concat([1]));
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="近12个月训练时长"><line class="grid" x1="'+L+'" y1="'+(H-B)+'" x2="'+(W-R)+'" y2="'+(H-B)+'"/>';
  keys.forEach(function(k,i){
    var v=vals[i],h=v>0?Math.max(3,(H-T-B)*v/max):2,x=L+slot*i+(slot-bw)/2,y=H-B-h,isSel=k===sel;
    s+='<rect class="bar1'+(isSel?' sel':'')+'" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw+'" height="'+h.toFixed(1)+'" rx="4"/>';
    if(v>0)s+='<text class="'+(isSel?'axv':'ax')+'" x="'+(x+bw/2).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" text-anchor="middle">'+(Math.round(v/360)/10)+'</text>';
    s+='<text class="'+(isSel?'axv':'ax')+'" x="'+(x+bw/2).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+(+k.slice(5))+'</text>';
    s+='<rect x="'+(L+slot*i).toFixed(1)+'" y="'+T+'" width="'+slot.toFixed(1)+'" height="'+(H-T-B)+'" fill="transparent" data-act="pickmonth" data-k="'+k+'"/>';
  });
  return s+'</svg>';
}
function lineChart(pts,invert){
  var W=360,H=190,L=38,R=16,T=18,B=26;
  var ys=pts.map(function(p){return p.y}),lo=Math.min.apply(null,ys),hi=Math.max.apply(null,ys);
  if(lo===hi){lo-=1;hi+=1}
  var step=niceStep((hi-lo)/3);lo=Math.floor(lo/step+1e-9)*step;hi=Math.ceil(hi/step-1e-9)*step;
  var X=function(i){return pts.length===1?L+(W-L-R)/2:L+(W-L-R)*i/(pts.length-1)};
  var Y=function(v){var t=(v-lo)/(hi-lo);return invert?T+(H-T-B)*t:H-B-(H-T-B)*t};
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="动作进步曲线">';
  for(var v=lo;v<=hi+1e-9;v+=step){var y=Y(v).toFixed(1);s+='<line class="grid" x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'"/><text class="ax" x="'+(L-6)+'" y="'+(+y+3.5)+'" text-anchor="end">'+fmtNum(+v.toFixed(2))+'</text>'}
  var d=pts.map(function(p,i){return (i?'L':'M')+X(i).toFixed(1)+' '+Y(p.y).toFixed(1)}).join(' ');
  if(pts.length>1)s+='<path class="ln" d="'+d+'"/>';
  pts.forEach(function(p,i){var last=i===pts.length-1;s+='<circle class="pt'+(last?' last':'')+'" cx="'+X(i).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="'+(last?5:3.2)+'"/>'});
  var lp=pts[pts.length-1];
  s+='<text class="axv" x="'+X(pts.length-1).toFixed(1)+'" y="'+(Y(lp.y)-9).toFixed(1)+'" text-anchor="'+(pts.length>1?'end':'middle')+'">'+fmtNum(lp.y)+'</text>';
  s+='<text class="ax" x="'+(pts.length>1?L:X(0).toFixed(1))+'" y="'+(H-8)+'" text-anchor="'+(pts.length>1?'start':'middle')+'">'+mdate(pts[0].start)+'</text>';
  if(pts.length>1)s+='<text class="ax" x="'+(W-R)+'" y="'+(H-8)+'" text-anchor="end">'+mdate(lp.start)+'</text>';
  return s+'</svg>';
}
function calendar(key,md){

  state.exercises.forEach(function(ex){if(lastPerf(ex.id))withHist.push(ex)});
  var seen={};withHist.forEach(function(e){seen[e.id]=1});
  state.sessions.forEach(function(s){s.items.forEach(function(it){if(!seen[it.exId]){seen[it.exId]=1;withHist.push({id:it.exId,name:it.name,type:it.type})}})});
  if(!withHist.length)return '<div class="empty">练过的动作会出现在这里，可以看每个动作的进步曲线。</div>';
  if(!ui.exSel||!seen[ui.exSel])ui.exSel=withHist[0].id;
  var ex=withHist.filter(function(e){return e.id===ui.exSel})[0];
  var pts=[],type=ex.type;
  state.sessions.slice().reverse().forEach(function(s){
    s.items.forEach(function(it){
      if(it.exId!==ex.id||!it.sets.length)return;
      type=it.type;var b=bestOf(it.type,it.sets);
      pts.push({start:s.start,set:b,n:it.sets.length,y:hasWeight(it.type)?b.w:b.r});
    });
  });
  pts=pts.slice(-30);
  var invert=type==='assist',unit=type==='time'?'秒':hasWeight(type)?'kg':'次';
  var best=histBest(ex.id,type);
  var f=pts[0],l=pts[pts.length-1],delta=l.y-f.y;
  var good=invert?delta<0:delta>0;
  var dTxt=pts.length<2?'再练一次就能看到变化':(delta===0?'没有变化':(good?'进步 ':'回落 ')+fmtNum(Math.abs(delta))+unit);
  var h='<div class="sel-ex"><label class="k" for="ex-sel">选择动作</label><select id="ex-sel">'+withHist.map(function(e){return '<option value="'+e.id+'"'+(e.id===ex.id?' selected':'')+'>'+esc(e.name)+'</option>'}).join('')+'</select></div>';
  h+='<div class="chart"><div class="cap">每次训练的最佳一组（'+(type==='assist'?'辅助重量，越少越靠上':hasWeight(type)?'重量':type==='time'?'秒数':'次数')+'，单位 '+unit+'）</div>'+lineChart(pts,invert)+'</div>';
  h+='<div class="prog"><div class="tile"><span class="k">历史最佳</span><div class="v">'+esc(fmtSet(type,best))+'</div></div><div class="tile"><span class="k">首次 → 最近</span><div class="v">'+fmtNum(f.y)+' → '+fmtNum(l.y)+'</div><div class="d">'+dTxt+'</div></div></div>';
  h+='<div class="hist">'+pts.slice().reverse().slice(0,6).map(function(p){return '<div><span>'+mdate(p.start)+' · '+p.n+' 组</span><span>最佳 '+esc(fmtSet(type,p.set))+'</span></div>'}).join('')+'</div>';
  return h;
}

function importJson(file){
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var o=JSON.parse(rd.result);
      if(!o||!Array.isArray(o.sessions))throw new Error('x');
      var have={};state.sessions.forEach(function(s){have[s.id]=1});
      var add=0;
      o.sessions.forEach(function(s){if(s&&s.id&&s.items&&!have[s.id]){state.sessions.push(s);putSession(s);add++}});
      state.sessions.sort(function(a,b){return b.start-a.start});
      if(o.meta){
        var ids={};state.exercises.forEach(function(e){ids[e.id]=1});
        (o.meta.exercises||[]).forEach(function(e){if(!ids[e.id])state.exercises.push(e)});
        var tids={};state.templates.forEach(function(t){tids[t.id]=1});
        (o.meta.templates||[]).forEach(function(t){if(!tids[t.id])state.templates.push(t)});
      }
      touch();closeSheet();render();toast('已导入 '+add+' 次训练');
    }catch(e){toast('这个文件不是林的训的备份')}
  };
  rd.readAsText(file);
}
function arm(el,text,fn){
  if(el.dataset.armed){clearTimeout(+el.dataset.armed);delete el.dataset.armed;fn();return}
  var old=el.textContent;el.textContent=text;
  el.dataset.armed=setTimeout(function(){el.textContent=old;delete el.dataset.armed},3000);
}

    var it=state.active.items[+el.dataset.i],k=el.dataset.k,d=+el.dataset.d;
    var step=k==='w'?(it.step||2.5):(it.type==='time'?5:1);
    var v=Math.max(0,Math.round((num(it[k])+d*step)*100)/100);
    it[k]=v;var inp=$('#in-'+el.dataset.i+'-'+k);if(inp)inp.value=fmtNum(v);touch();
  },
  tgt:function(el){var it=state.active.items[+el.dataset.i];it.target=Math.max(it.sets.length||1,it.target+(+el.dataset.d));touch();render()},
  done:function(el){completeSet(+el.dataset.i)},
  undo:function(el){var a=state.active,it=a.items[+el.dataset.i];if(!it.sets.length)return;it.sets.pop();if(a.rest&&a.rest.name===it.name)a.rest=null;touch();render()},
  rest:function(el){var it=state.active.items[+el.dataset.i];it.rest=+el.dataset.v;var ex=state.exercises.filter(function(e){return e.id===it.exId})[0];if(ex)ex.rest=it.rest;touch();render()},
  rmitem:function(el){arm(el,'再点移除',function(){state.active.items.splice(+el.dataset.i,1);touch();render()})},
  additem:function(){openPicker()},
  pick:function(el){
    var ex=state.exercises.filter(function(e){return e.id===el.dataset.id})[0];if(!ex||!state.active)return;
    state.active.items.push(makeItem(ex));touch();render();
    document.querySelectorAll('#sheet .pick[data-id="'+el.dataset.id+'"]').forEach(function(b){b.classList.add('added');b.disabled=true;b.querySelector('.tg').textContent='已添加'});
  },
  newex:function(el){openEditor(null,el.dataset.add==='1')},
  editex:function(el){openEditor(el.dataset.id,false)},
  saveex:function(el){saveExercise(el.dataset.id,el.dataset.add==='1')},
  delex:function(el){arm(el,'再点一次确认删除',function(){state.exercises=state.exercises.filter(function(e){return e.id!==el.dataset.id});touch();closeSheet();render()})},
  finish:function(){openFinish()},
  savewk:function(){saveWorkout()},
  discard:function(el){arm(el,'再点一次放弃',function(){state.active=null;touch();closeSheet();render()})},
  'rest-adj':function(el){
    var r=state.active&&state.active.rest;if(!r)return;
    var d=+el.dataset.d,now=Date.now();
    r.end=Math.max(now+1000,r.end+d*1000);r.total=Math.max(5,r.total+d);
    if(r.end>now)alertedEnd=0;resetTitle();touch();tick();
  },
  'rest-skip':function(){if(state.active)state.active.rest=null;resetTitle();touch();renderDock()},
  toggle:function(el){ui.open[el.dataset.id]=!ui.open[el.dataset.id];render()},
  again:function(el){
    if(state.active){toast('先结束正在进行的训练');return}
    var s=state.sessions.filter(function(x){return x.id===el.dataset.id})[0];if(!s)return;
    startWorkout(s.items.map(function(it){return makeItem(exFromSnap(it),it.sets.length)}));
  },
  delsess:function(el){arm(el,'再点一次删除',function(){state.sessions=state.sessions.filter(function(x){return x.id!==el.dataset.id});delSession(el.dataset.id);touch();render();toast('已删除这次训练')})},
  month:function(el){var k=shiftMonth(ui.month,+el.dataset.d);if(k>mk(Date.now()))return;ui.month=k;render()},
  pickmonth:function(el){ui.month=el.dataset.k;render()},
  testsound:function(){unlockAudio();beep();if(state.settings.vibrate){try{if(navigator.vibrate)navigator.vibrate(200)}catch(e){}}},
  export:function(){exportJson()},
  exportcsv:function(){exportCsv()},
  clearall:function(el){arm(el,'再点一次清空，无法恢复',function(){
    var ids=state.sessions.map(function(s){return s.id});
    ids.forEach(function(id){delSession(id)});
    state=normalize(null,[]);touch();closeSheet();render();toast('已清空');
  })}
};
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  unlockAudio();
  var f=H[el.dataset.act];if(f)f(el,e);
});
document.addEventListener('input',function(e){
  if(e.target&&e.target.id==='plan-q'){applyFilter(e.target);return}
  if(e.target.id==='pk-q'||e.target.id==='lib-q'){applyFilter(e.target);return}
  var t=e.target;
  if(t.dataset&&t.dataset.k&&t.dataset.i!==undefined&&state.active){
    var it=state.active.items[+t.dataset.i];if(!it)return;
    var v=parseFloat(t.value);if(isNaN(v)||v<0)return;
    if(t.dataset.k==='rest'){
      v=Math.round(v);it.rest=v;
      var ex=state.exercises.filter(function(x){return x.id===it.exId})[0];if(ex)ex.rest=v;
      var box=t.closest('.rest');if(box)box.querySelectorAll('.chip').forEach(function(c){c.classList.toggle('on',+c.dataset.v===v)});
    }else it[t.dataset.k]=v;
    touch();
  }
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.name==='e-type')syncEditor();
  else if(t.dataset&&t.dataset.set){state.settings[t.dataset.set]=t.checked;touch()}
  else if(t.id==='ex-sel'){ui.exSel=t.value;render()}
  else if(t.id==='f-import'&&t.files&&t.files[0])importJson(t.files[0]);
});
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible'){
    var r=state.active&&state.active.rest;
    if(!r||r.end>Date.now())resetTitle();
    syncWake();tick();
  }
});

function render(){
  $('#live').hidden=!state.active;
  document.querySelectorAll('.tabs button').forEach(function(b){b.classList.toggle('on',b.dataset.t===ui.tab);b.setAttribute('aria-current',b.dataset.t===ui.tab?'page':'false')});
  $('#view').innerHTML=ui.tab==='train'?viewTrain():ui.tab==='log'?viewLog():ui.tab==='stats'?viewStats():viewLib();
  renderDock();
  tick();
  syncWake();
}
render();
if(migrated){touch();migrated=false}else{touch()}
setInterval(tick,250);
// 独立 PWA 使用本地存储，不连接云端。
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){});});}
})();
</script>

</body></html>
